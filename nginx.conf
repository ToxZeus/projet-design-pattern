server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths (e.g. /tasks/1) serve index.html so the
    # client-side router can handle them, even on a full page reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
